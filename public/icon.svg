<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-dasharray="16 12" />
  <!-- Pulse radar wave -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="4" />
  <!-- City skyline silhouette -->
  <path d="M140 330 L140 290 L180 290 L180 250 L220 250 L220 280 L250 280 L250 210 L290 210 L290 270 L330 270 L330 240 L372 240 L372 330 Z" fill="rgba(255,255,255,0.12)" />
  <!-- Pulse Waveform + Pin -->
  <g filter="url(#glow)">
    <path d="M120 290 L180 290 L210 330 L240 170 L270 360 L300 250 L330 290 L392 290" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Map Pin Center -->
  <circle cx="256" cy="150" r="38" fill="#38bdf8" />
  <circle cx="256" cy="150" r="16" fill="#0f172a" />
</svg>
